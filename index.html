<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UATx | Sistema de Gestión Arbórea </title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Outfit:wght@300;400;600&display=swap');
        :root { --bg-crema: #fdfbf7; --verde-musgo: #2c4a3e; --oro: #c5a059; --alerta: #d62828; }
        body { font-family: 'Outfit', sans-serif; background-color: var(--bg-crema); color: #2b2d42; }
        .titulo-medieval { font-family: 'Cinzel', serif; }
        .tab-section { display: none; }
        .tab-section.active { display: block; animation: fadeIn 0.6s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .alerta-peligro { animation: parpadeo 2s infinite alternate; border: 2px solid var(--alerta); }
        @keyframes parpadeo { from { box-shadow: 0 0 5px rgba(214,40,40,0.2); } to { box-shadow: 0 0 15px rgba(214,40,40,0.5); } }
    </style>
</head>
<body>

    <header class="border-b border-[#e9e3d3] sticky top-0 z-50 bg-[#fdfbf7]/90 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center gap-4">
                <div class="h-12 w-12 rounded-full flex items-center justify-center text-white" style="background-color: var(--verde-musgo);">
                    <i class="fas fa-tree text-[#dfcba5]"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold text-[#2c4a3e] titulo-medieval">UATx <span class="font-light text-slate-500">| BIOCATASTRO</span></h1>
                </div>
            </div>
            <nav class="hidden lg:flex gap-6">
                <button onclick="nav('inicio')" class="px-3 py-2 font-semibold text-emerald-900 border-b-2 border-amber-600">Dashboard</button>
                <button onclick="nav('viaje')" class="px-3 py-2 font-semibold text-slate-500">El Viaje del Muérdago</button>
            </nav>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-6 py-12">
        <section id="inicio" class="tab-section active">
            <h2 class="text-3xl font-bold text-[#2c4a3e] titulo-medieval mb-8">Estado Sanitario Actual</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12">
                <div class="bg-white p-6 rounded-2xl border border-[#e9e3d3] text-center">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Total Árboles</p>
                    <span class="text-4xl font-bold text-[#2c4a3e]">347</span>
                </div>
                <div class="bg-white p-6 rounded-2xl alerta-peligro text-center">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Infestados</p>
                    <span class="text-4xl font-bold text-red-600">16</span>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-[#e9e3d3] text-center">
                    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest">Índice de Salud</p>
                    <span class="text-4xl font-bold text-emerald-700">95%</span>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="bg-white p-6 rounded-2xl border border-[#e9e3d3]">
                    <h3 class="text-sm font-bold text-[#2c4a3e] uppercase mb-4">Estado de Salud General</h3>
                    <canvas id="chartDonut"></canvas>
                </div>
                <div class="bg-white p-6 rounded-2xl border border-[#e9e3d3]">
                    <h3 class="text-sm font-bold text-[#2c4a3e] uppercase mb-4">Top 5 Especies con Infestación</h3>
                    <canvas id="chartTop"></canvas>
                </div>
            </div>
        </section>
    </main>

    <script>
        function nav(id) {
            document.querySelectorAll('.tab-section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        window.onload = function() {
            // Datos del Resumen
            const ctxDonut = document.getElementById('chartDonut').getContext('2d');
            new Chart(ctxDonut, {
                type: 'doughnut',
                data: {
                    labels: ['Sano', 'Leve', 'Moderado', 'Medio', 'Severo', 'Crítico'],
                    datasets: [{
                        data: [331, 2, 6, 4, 2, 2],
                        backgroundColor: ['#2c4a3e', '#dfcba5', '#bc6c25', '#c5a059', '#d62828', '#780000']
                    }]
                }
            });

            // Datos de Especies Afectadas
            const ctxTop = document.getElementById('chartTop').getContext('2d');
            new Chart(ctxTop, {
                type: 'bar',
                data: {
                    labels: ['Peral', 'Capulín', 'Zapote', 'Tejocote', 'Durazno'],
                    datasets: [{
                        label: 'Ejemplares Enfermos',
                        data: [12, 2, 1, 1, 0], // Basado en columna de infestación
                        backgroundColor: '#bc6c25'
                    }]
                },
                options: { indexAxis: 'y' }
            });
        };
    </script>
</body>
</html>
